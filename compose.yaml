services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: land
      POSTGRES_USER: land
      POSTGRES_PASSWORD: land
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U land -d land"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    restart: "no"

volumes:
  pgdata:
